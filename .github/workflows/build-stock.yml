name: Build Kernel A11K STOCK CONFIG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Ambil source kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Perbaiki include kernel-4.9
        run: |
          ln -sfn . kernel-4.9

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential libssl-dev libelf-dev \
            cpio zip gcc-9 g++-9 python2

      - name: Ambil compiler GCC 4.9
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            "$HOME/gcc64"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            "$HOME/gcc32"

      - name: Hilangkan -Werror untuk kompatibilitas build
        run: |
          grep -rlE -- '-Werror([-=][A-Za-z0-9_-]+)?' \
            --include=Makefile . \
            | xargs -r sed -i -E \
            's/-Werror([-=][A-Za-z0-9_-]+)?//g'

      - name: Pasang config stock
        run: |
          test -s stock.config
          mkdir -p out
          cp stock.config out/.config

          echo "===== STOCK CONFIG ====="
          wc -l out/.config

          echo "===== LCM STOCK ====="
          grep '^CONFIG_CUSTOM_KERNEL_LCM=' out/.config || true

          echo "===== IMGSENSOR STOCK ====="
          grep '^CONFIG_CUSTOM_KERNEL_IMGSENSOR=' out/.config || true

          echo "===== STACK PROTECTOR STOCK ====="
          grep 'CONFIG_CC_STACKPROTECTOR' out/.config || true

          echo "===== LOCALVERSION STOCK ====="
          grep '^CONFIG_LOCALVERSION=' out/.config || true

          cp out/.config config-before-olddefconfig

      - name: Validasi config terhadap source
        run: |
          set -o pipefail

          export PATH=$HOME/gcc64/bin:$HOME/gcc32/bin:$PATH

          make O=out \
            ARCH=arm64 \
            HOSTCC=gcc-9 \
            HOSTCXX=g++-9 \
            olddefconfig 2>&1 | tee olddefconfig.log

      - name: Bandingkan config sebelum dan sesudah
        run: |
          cp out/.config config-after-olddefconfig

          diff -u \
            <(sort config-before-olddefconfig) \
            <(sort config-after-olddefconfig) \
            > config-olddefconfig.diff || true

          echo "===== JUMLAH PERUBAHAN ====="
          wc -l config-olddefconfig.diff

          echo
          echo "===== LCM SETELAH OLDDEFCONFIG ====="
          grep '^CONFIG_CUSTOM_KERNEL_LCM=' \
            config-after-olddefconfig || true

          echo
          echo "===== IMGSENSOR SETELAH OLDDEFCONFIG ====="
          grep '^CONFIG_CUSTOM_KERNEL_IMGSENSOR=' \
            config-after-olddefconfig || true

      - name: Compile kernel
        run: |
          set -o pipefail

          export PATH=$HOME/gcc64/bin:$HOME/gcc32/bin:$PATH

          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            HOSTCC=gcc-9 \
            HOSTCXX=g++-9 \
            CROSS_COMPILE=aarch64-linux-android- \
            KCFLAGS=-Wno-error \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            Image.gz-dtb 2>&1 | tee build.log

      - name: Kumpulkan hasil
        if: always()
        run: |
          mkdir -p hasil

          cp out/arch/arm64/boot/Image.gz-dtb \
            hasil/ 2>/dev/null || true

          cp config-before-olddefconfig \
            hasil/ 2>/dev/null || true

          cp config-after-olddefconfig \
            hasil/ 2>/dev/null || true

          cp config-olddefconfig.diff \
            hasil/ 2>/dev/null || true

          cp olddefconfig.log \
            hasil/ 2>/dev/null || true

          cp build.log \
            hasil/ 2>/dev/null || true

          ls -lah out/arch/arm64/boot/ \
            > hasil/isi-folder-boot.txt 2>&1 || true

      - name: Upload hasil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-a11k-stock-config
          path: hasil/*